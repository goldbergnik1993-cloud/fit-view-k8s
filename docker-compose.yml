version: '3.8'

x-environment: &common-env
  DATABASE_URL: postgresql+asyncpg://${PGUSER}:${PGPASSWORD}@${PGHOST}/${PGDATABASE}
  PGHOST: ${PGHOST}
  PGDATABASE: ${PGDATABASE}
  PGUSER: ${PGUSER}
  PGPASSWORD: ${PGPASSWORD}
  PGCHANNELBINDING: ${PGCHANNELBINDING}
  SECRET_KEY: ${SECRET_KEY}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
  ACTIVATION_CODE_EXPIRE_MINUTES: ${ACTIVATION_CODE_EXPIRE_MINUTES}
  RESET_TOKEN_EXPIRE_MINUTES: ${RESET_TOKEN_EXPIRE_MINUTES}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
  REDIS_URL: ${REDIS_URL}
  ENV: development
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  FRONTEND_URL: ${FRONTEND_URL}
  VITE_API_URL: ${VITE_API_URL}

services:
  nginx:
    image: nginx:stable-alpine
    container_name: fitview_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server/static:/var/www/static:ro
    depends_on:
      - frontend
      - backend
    networks:
      - fit-network

  frontend:
    build:
      context: ./client
      target: development
      args:
        - VITE_API_URL=${VITE_API_URL}
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - fit-network
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fitview_backend
    volumes:
      - ./server:/app
      - /app/.venv
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment: *common-env
    depends_on:
      - redis
    networks:
      - fit-network

  celery_worker:
    build:
      context: ./server
    container_name: fitview_worker
    command: celery -A core.celery_app worker --loglevel=info
    volumes:
      - ./server:/app
      - /app/.venv
    environment: *common-env
    depends_on:
      - redis
    networks:
      - fit-network

  celery_beat:
    build:
      context: ./server
    container_name: fitview_beat
    command: celery -A core.celery_app beat --loglevel=info
    volumes:
      - ./server:/app
      - /app/.venv
    environment: *common-env
    depends_on:
      - redis
    networks:
      - fit-network

  adminer:
    image: adminer
    container_name: fitview_adminer
    ports:
      - "8080:8080"
    networks:
      - fit-network

  redis:
    image: redis:7-alpine
    container_name: fitview_redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - fit-network

  mailhog:
    image: axllent/mailpit:v1.30.6
    container_name: fitview_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: always
    networks:
      - fit-network

  flower:
    image: mher/flower:latest
    container_name: fitview_flower
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    networks:
      - fit-network

networks:
  fit-network:
    driver: bridge
