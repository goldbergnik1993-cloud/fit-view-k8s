name: CI Quality Control

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'client/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'client/**'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: ${{ matrix.project.name }} Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - { name: "Backend", path: "server", type: "python" }
          - { name: "Frontend", path: "client", type: "node" }

    defaults:
      run:
        working-directory: ./${{ matrix.project.path }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        if: matrix.project.type == 'python'
        run: pipx install poetry

      - name: Set up Python 3.12
        if: matrix.project.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'poetry'
          cache-dependency-path: server/poetry.lock

      - name: Install Python Dependencies
        if: matrix.project.type == 'python'
        run: poetry install --sync

      - name: Python Quality
        if: matrix.project.type == 'python'
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy .

      # --- FRONTEND ---
      - name: Set up Node.js 22
        if: matrix.project.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install JS Dependencies
        if: matrix.project.type == 'node'
        run: npm ci

      - name: Node Quality
        if: matrix.project.type == 'node'
        run: |
          npm run lint
          npm run build
