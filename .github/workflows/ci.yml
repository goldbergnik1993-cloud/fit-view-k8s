name: CI Quality Control & Docker Build

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'client/**'
      - '.github/workflows/**'
      - 'docker-compose*'
      - 'nginx.conf'
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'client/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - { name: "backend", path: "server", type: "python", dockerfile: "server/Dockerfile" }
          - { name: "frontend", path: "client", type: "node", dockerfile: "client/Dockerfile" }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        continue-on-error: true
        with:
          dockerfile: ${{ matrix.project.dockerfile }}

      - name: Install Poetry
        if: matrix.project.type == 'python'
        run: pipx install poetry

      - name: Set up Python
        if: matrix.project.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'poetry'
          cache-dependency-path: server/poetry.lock

      - name: Python Quality
        if: matrix.project.type == 'python'
        working-directory: ./server
        continue-on-error: true
        run: |
          poetry install --sync
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy .

      - name: Set up Node
        if: matrix.project.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Node Quality
        if: matrix.project.type == 'node'
        working-directory: ./client
        continue-on-error: true
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Set up QEMU
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: goldbernik/fitview-${{ matrix.project.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.project.path }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.project.name == 'frontend' && 'VITE_API_URL=/api' || '' }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy scanner
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: goldbernik/fitview-${{ matrix.project.name }}:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

  deploy-staging:
    needs: quality-and-build
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && success()
    uses: ./.github/workflows/deploy-stage.yml
    with:
      environment: staging
    secrets: inherit
