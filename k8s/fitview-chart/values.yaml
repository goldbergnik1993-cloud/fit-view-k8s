# Общие настройки
global:
  domain: fitview.local

# --- BACKEND (FastAPI) ---
backend:
  replicaCount: 2
  image:
    repository: fitview-backend # Плейсхолдер
    tag: "latest"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8000

  # Настройки безопасности (Non-root)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
  
  # Лимиты ресурсов
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Горизонтальное автоскейлирование
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

  # Переменные окружения (секреты пойдут через ExternalSecret)
  env:
    ACCESS_TOKEN_EXPIRE_MINUTES: "15"
    REFRESH_TOKEN_EXPIRE_DAYS: "7"

# --- FRONTEND (Vite + Nginx) ---
frontend:
  replicaCount: 2
  image:
    repository: fitview-frontend # Плейсхолдер
    tag: "latest"
  
  service:
    type: ClusterIP
    port: 80

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

# --- DATABASE (PostgreSQL) ---
database:
  image: postgres:15-alpine
  user: fitview_admin
  dbName: fitview_db
  port: 5432
  storage:
    size: 10Gi
    mountPath: /var/lib/postgresql/data
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# --- NETWORKING (Ingress) ---
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: fitview.local
      paths:
        - path: /
          pathType: Prefix
          component: frontend
        - path: /api
          pathType: Prefix
          component: backend
