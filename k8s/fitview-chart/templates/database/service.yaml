apiVersion: v1
kind: Service
metadata:
  name: {{ include "fitview.fullname" . }}-db
  labels:
    {{- include "fitview.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.database.port }}
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "fitview.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
