apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "fitview.fullname" . }}-db-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ include "fitview.fullname" . }}-db-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: fitview/db/password

---

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "fitview.fullname" . }}-app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ include "fitview.fullname" . }}-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef:
        key: fitview/backend/secret-key
