apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fitview.fullname" . }}-frontend-config
  labels:
    {{- include "fitview.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Проверка здоровья для кубера
        location /healthz {
            access_log off;
            return 200 "healthy\n";
        }
    }
